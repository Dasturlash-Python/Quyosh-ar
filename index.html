<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quyosh tizimi — sinf AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: sans-serif; background: #f1f5f9;
    }
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
    }
    #hint {
      position: absolute; top: 20px; left: 12px; right: 12px;
      text-align: center; color: #fff; text-shadow: 0 1px 4px #000;
      font-size: 16px; pointer-events: none;
    }
    #ui {
      position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
    }
    #ui button {
      pointer-events: auto;
      padding: 14px 24px; font-size: 18px; border: none; border-radius: 12px;
      background: #2563eb; color: #fff; margin: 6px;
    }
    #ui button:disabled { background: #94a3b8; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="hint">Sahifa yuklanmoqda...</div>
    <div id="ui">
      <button id="startBtn" disabled>AR boshlash</button>
      <button id="resetBtn" style="display:none">Qayta joylash</button>
    </div>
  </div>

  <a-scene embedded
    renderer="colorManagement: true; alpha: true"
    xr-mode-ui="enabled: false"
    vr-mode-ui="enabled: false">

    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" intensity="0.8" position="1 2 1"></a-light>

    <!-- Tekis yuzani ko'rsatuvchi halqa -->
    <a-entity id="reticle">
      <a-ring rotation="-90 0 0" radius-inner="0.07" radius-outer="0.09"
        material="color: #ffffff; shader: flat; transparent: true; opacity: 0.9"></a-ring>
    </a-entity>

    <!-- Quyosh tizimi (dastlab yashirin) -->
    <a-entity id="solar" scale="0.15 0.15 0.15">
      <a-sphere radius="0.5" color="#FDB813" emissive="#FDB813" emissive-intensity="0.6"></a-sphere>
      <a-sphere id="p1" radius="0.10" color="#B5B5B5"></a-sphere>
      <a-sphere id="p2" radius="0.14" color="#E8CDA2"></a-sphere>
      <a-sphere id="p3" radius="0.15" color="#3B7DD8"></a-sphere>
      <a-sphere id="p4" radius="0.12" color="#C1440E"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const reticle = document.getElementById('reticle');
    const solar = document.getElementById('solar');
    const hint = document.getElementById('hint');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const overlayRoot = document.getElementById('overlay');

    // Sayyoralar: orbita radiusi va aylanish tezligi
    const planets = [
      { el: document.getElementById('p1'), r: 1.5, speed: 1.2 },
      { el: document.getElementById('p2'), r: 2.2, speed: 0.9 },
      { el: document.getElementById('p3'), r: 3.1, speed: 0.6 },
      { el: document.getElementById('p4'), r: 4.0, speed: 0.4 }
    ];

    let xrSession = null;
    let localSpace = null;
    let hitTestSource = null;
    let placed = false;
    let overlayActive = false;

    reticle.object3D.visible = false;
    solar.object3D.visible = false;

    function setHint(text) {
      hint.textContent = text;
    }

    function setupXRRenderer() {
      // Renderer XR uchun sozlanadi; referens fazo "local" bilan bir xil bo'lishi kerak
      scene.renderer.xr.enabled = true;
      scene.renderer.xr.setReferenceSpaceType('local');
    }

    // Sahifa tayyor bo'lganda: WebXR va AR qo'llab-quvvatlanishini tekshirish
    async function init() {
      setupXRRenderer();

      if (!navigator.xr) {
        setHint("Bu brauzer WebXR ni qo'llab-quvvatlamaydi. Android'da Google Chrome oching.");
        return;
      }
      try {
        const ok = await navigator.xr.isSessionSupported('immersive-ar');
        if (ok) {
          setHint('Tayyor. "AR boshlash" ni bosing.');
          startBtn.disabled = false;
        } else {
          setHint("Bu qurilmada immersive-ar qo'llab-quvvatlanmaydi. ARCore ni tekshiring.");
        }
      } catch (e) {
        setHint('Tekshiruvda xato: ' + (e.name || '') + ' ' + (e.message || ''));
      }
    }

    if (scene.hasLoaded) {
      init();
    } else {
      scene.addEventListener('loaded', init);
    }

    // AR boshlash: requestSession to'g'ridan-to'g'ri foydalanuvchi bosishi ichida chaqiriladi
    startBtn.addEventListener('click', async () => {
      if (!navigator.xr) {
        alert("Bu brauzer WebXR ni qo'llab-quvvatlamaydi.");
        return;
      }
      if (!scene.renderer) {
        alert("Sahifa hali yuklanmoqda. Bir ozdan so'ng qayta urinib ko'ring.");
        return;
      }

      // Avval dom-overlay bilan, keyin u ishlamasa, oddiyroq variantlar bilan urinadi
      const attempts = [
        {
          requiredFeatures: [],
          optionalFeatures: ['local-floor', 'hit-test', 'dom-overlay'],
          domOverlay: { root: overlayRoot }
        },
        {
          requiredFeatures: [],
          optionalFeatures: ['local-floor', 'hit-test']
        },
        {
          requiredFeatures: [],
          optionalFeatures: []
        }
      ];

      let session = null;
      let lastErr = null;
      for (const opts of attempts) {
        try {
          session = await navigator.xr.requestSession('immersive-ar', opts);
          break;
        } catch (e) {
          lastErr = e;
        }
      }

      if (!session) {
        alert('AR ishga tushmadi: ' + (lastErr && lastErr.name) + ' - ' + (lastErr && lastErr.message));
        return;
      }

      xrSession = session;
      overlayActive = !!session.domOverlayState;
      startBtn.style.display = 'none';
      setHint('Stol yuzasini toping...');

      // Three.js renderer ni AR sessiyasiga ulash
      await scene.renderer.xr.setSession(session);

      session.addEventListener('select', onSelect);
      session.addEventListener('end', onEnd);

      try {
        localSpace = await session.requestReferenceSpace('local');
        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        setHint(overlayActive
          ? 'Stol yuzasini toping, halqa paydo bo\'lganda ekranga bosing'
          : 'Stol yuzasini toping, halqa paydo bo\'lganda ekranga bosing (tugmalar ishlamasligi mumkin)');
      } catch (e) {
        hitTestSource = null;
        setHint('Yuzani aniqlash ishlamadi: ' + (e.name || '') + ' ' + (e.message || ''));
      }

      session.requestAnimationFrame(onFrame);
    });

    // Har kadrda: halqani yuzaga joylashtirish va sayyoralarni aylantirish
    function onFrame(time, frame) {
      if (!xrSession) return;
      xrSession.requestAnimationFrame(onFrame);

      if (!placed && hitTestSource && localSpace && frame) {
        const results = frame.getHitTestResults(hitTestSource);
        if (results.length > 0) {
          const pose = results[0].getPose(localSpace);
          if (pose) {
            const p = pose.transform.position;
            const q = pose.transform.orientation;
            reticle.object3D.position.set(p.x, p.y, p.z);
            reticle.object3D.quaternion.set(q.x, q.y, q.z, q.w);
            reticle.object3D.visible = true;
          }
        } else {
          reticle.object3D.visible = false;
        }
      }

      if (placed) {
        const s = time / 1000;
        planets.forEach(pl => {
          const a = s * pl.speed;
          pl.el.object3D.position.set(Math.cos(a) * pl.r, 0, Math.sin(a) * pl.r);
        });
      }
    }

    // Ekranga bosilganda Quyosh tizimini joylashtirish
    function onSelect() {
      if (placed || !reticle.object3D.visible) return;

      const THREE = AFRAME.THREE;
      const up = new THREE.Vector3(0, 0.08, 0).applyQuaternion(reticle.object3D.quaternion);

      solar.object3D.position.copy(reticle.object3D.position).add(up);
      solar.object3D.quaternion.copy(reticle.object3D.quaternion);
      solar.object3D.visible = true;
      reticle.object3D.visible = false;
      placed = true;

      resetBtn.style.display = 'inline-block';
      setHint('Quyosh tizimi joylashtirildi!');
    }

    // Qayta joylashtirish
    resetBtn.addEventListener('click', () => {
      placed = false;
      solar.object3D.visible = false;
      resetBtn.style.display = 'none';
      setHint('Stol yuzasini toping...');
    });

    // AR tugaganda holatni tiklash
    function onEnd() {
      xrSession = null;
      localSpace = null;
      hitTestSource = null;
      placed = false;
      overlayActive = false;
      solar.object3D.visible = false;
      reticle.object3D.visible = false;
      startBtn.style.display = 'inline-block';
      resetBtn.style.display = 'none';
      setHint('AR tugadi. Qayta boshlash uchun "AR boshlash" ni bosing.');
    }
  </script>
</body>
</html>
